  <text x="480" y="790" font-size="12">Ngưỡng chopper 700 ± 20 V / U_dc ≤ 780 V / trip 800 ± 10 V là tham số thiết kế mô hình (Downstream #3), chưa xác minh trong firmware ACS380.</text>
  <text x="480" y="810" font-size="12">Mã giao diện IF-xx theo ICD-8.5EMG-TROLLEY-v1.0. Bản vẽ nguyên lý (không phải bản vẽ lắp đặt/đi dây — Out-of-Scope SOW).</text>
  <text x="480" y="830" font-size="12">Cáp, cầu chì/aptomat, tiết diện dây: `Không áp dụng vì đồ án mô phỏng` (chỉ ghi yêu cầu định cỡ).</text>
